plugins {
    id 'java'
    id 'net.serenity-bdd.serenity-gradle-plugin' version '4.2.34'
}

group = 'com.o2'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'net.serenity-bdd:serenity-core:4.2.34'
    testImplementation 'net.serenity-bdd:serenity-rest-assured:4.2.34'
    testImplementation 'net.serenity-bdd:serenity-junit5:4.2.34'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    // Jackson for JSON serialization/deserialization
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'

    // JSON Schema validation
    testImplementation 'io.rest-assured:json-schema-validator:5.3.2'

    // Hamcrest
    testImplementation 'org.hamcrest:hamcrest:2.2'
}

test {
    useJUnitPlatform()
    finalizedBy aggregate
}

aggregate {
    dependsOn test
}
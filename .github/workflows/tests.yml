name: API Integration Tests

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:
        inputs:
            test_group:
                description: "Test group to run"
                required: false
                default: "all"
                type: choice
                options:
                    - all
                    - smoke
                    - regression
                    - negative
            environment:
                description: "Environment to run against"
                required: false
                default: "test"
                type: choice
                options:
                    - dev
                    - test

jobs:
    test:
        name: Run Serenity BDD Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Java 17
              uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"

            - name: Cache Gradle packages
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                  key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            - name: Grant execute permission to Gradle wrapper
              run: chmod +x gradlew

            - name: Run tests
              run: |
                  cmd="./gradlew clean test -Denvironment=${{ inputs.environment }}"
                  if [ "${{ inputs.test_group }}" != "all" ]; then
                    cmd="$cmd -Dgroups=${{ inputs.test_group }}"
                  fi
                  eval $cmd

            - name: Upload Serenity HTML Report
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: serenity-report
                  path: target/site/serenity/
                  retention-days: 30

            - name: Upload test results
              uses: actions/upload-artifact@v4
              if: always()
              with:
                  name: test-results
                  path: build/test-results/
                  retention-days: 7
